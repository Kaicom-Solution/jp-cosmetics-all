server {
    listen 80;
    server_name juaab.kaicombd.com;

    # This matches the volume mapping: ../juaab-web-app:/var/www/juaab-backend
    root /var/www/juaab-backend/public;
    index index.php index.html;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;

        # This matches the service name in docker-compose.yml
        fastcgi_pass juaab-backend:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}